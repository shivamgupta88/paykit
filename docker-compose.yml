services:
  postgres:
    image: postgres:16-alpine
    container_name: paykit-postgres
    environment:
      POSTGRES_DB: paykit
      POSTGRES_USER: paykit
      POSTGRES_PASSWORD: paykit_secret
    ports:
      - "5432:5432"
    volumes:
      - paykit_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U paykit"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: paykit-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  paykit_pgdata:
