spring:
  application:
    name: paykit

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/paykit}
    username: ${DB_USERNAME:paykit}
    password: ${DB_PASSWORD:paykit_secret}
    hikari:
      maximum-pool-size: ${HIKARI_MAX_POOL:20}
      minimum-idle: ${HIKARI_MIN_IDLE:5}
      idle-timeout: 300000
      max-lifetime: 600000
      connection-timeout: 20000

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        jdbc.time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true

  cache:
    type: redis
    redis:
      time-to-live: 3600000

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,flyway,metrics
  endpoint:
    health:
      show-details: when_authorized

paykit:
  encryption:
    secret-key: ${ENCRYPTION_SECRET_KEY:CHANGE_ME_32_CHAR_SECRET_KEY_HERE}
  jwt:
    secret: ${JWT_SECRET:CHANGE_ME_JWT_SECRET_KEY_MUST_BE_AT_LEAST_256_BITS}
    expiration-ms: ${JWT_EXPIRATION:86400000}
  razorpay:
    key-id: ${RAZORPAY_KEY_ID:}
    key-secret: ${RAZORPAY_KEY_SECRET:}
    webhook-secret: ${RAZORPAY_WEBHOOK_SECRET:}
  cors:
    allowed-origins: ${CORS_ORIGINS:http://localhost:3000}
  rate-limit:
    requests-per-minute: ${RATE_LIMIT_RPM:30}

resilience4j:
  circuitbreaker:
    instances:
      razorpay:
        sliding-window-size: 10
        failure-rate-threshold: 50
        wait-duration-in-open-state: 30s
        permitted-number-of-calls-in-half-open-state: 3
  retry:
    instances:
      razorpay:
        max-attempts: 3
        wait-duration: 1s
