spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/paykit
    username: paykit
    password: paykit_secret

  data:
    redis:
      host: localhost
      port: 6379

  jpa:
    show-sql: true
    properties:
      hibernate:
        format_sql: true

logging:
  level:
    com.paykit: DEBUG
    org.springframework.security: DEBUG
